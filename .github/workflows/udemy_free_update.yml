name: Update Udemy Free Courses JSON

on:
  schedule:
    # Chạy mỗi 1 giờ (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-courses:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Generate courses JSON
        env:
          # Có thể chỉnh số trang tối đa mỗi site qua biến này nếu cần
          # UDEMY_FREE_MAX_PAGES: "3"
          UDEMY_FREE_MAX_PAGES: ""
        run: |
          python udemy_free/build_courses_json.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$(git status --porcelain udemy_free/api/courses.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add udemy_free/api/courses.json
            git commit -m "chore: update Udemy free courses JSON"
            git push
          else
            echo "No changes to commit."
          fi

